name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/de/dk8de/rotorapp/Version.kt'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Explizit pinnen (ubuntu-latest wechselt ab Okt 2026 auf Ubuntu 26)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version aus Version.kt lesen
        id: ver
        shell: bash
        run: |
          FILE="app/src/main/java/de/dk8de/rotorapp/Version.kt"
          major=$(grep -E 'const val MAJOR\s*=' "$FILE" | sed -E 's/.*MAJOR\s*=\s*([0-9]+).*/\1/')
          minor=$(grep -E 'const val MINOR\s*=' "$FILE" | sed -E 's/.*MINOR\s*=\s*([0-9]+).*/\1/')
          patch=$(grep -E 'const val PATCH\s*=' "$FILE" | sed -E 's/.*PATCH\s*=\s*([0-9]+).*/\1/')
          version="${major}.${minor}.${patch}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Gelesen: ${tag}"

      - name: Prüfen ob Tag schon existiert
        id: tagcheck
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} existiert bereits — Release wird übersprungen."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} ist neu — Release wird erstellt."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle Wrapper ausführbar
        run: chmod +x gradlew

      # Ohne festen Keystore würfelt Gradle pro Lauf einen Debug-Key —
      # dann verweigert Android das Update und nur Deinstallieren hilft.
      - name: Keystore aus Secret entpacken
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ROTOR_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ROTOR_KEYSTORE_B64 fehlt — Release würde unsignierbar sein."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rotor-release.jks"
          ls -l "$RUNNER_TEMP/rotor-release.jks"

      - name: APK bauen (release)
        env:
          ROTOR_KEYSTORE_FILE: ${{ runner.temp }}/rotor-release.jks
          ROTOR_KEYSTORE_PASSWORD: ${{ secrets.ROTOR_KEYSTORE_PASSWORD }}
          ROTOR_KEY_ALIAS: ${{ secrets.ROTOR_KEY_ALIAS }}
          ROTOR_KEY_PASSWORD: ${{ secrets.ROTOR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Signatur prüfen
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$OUT"
          # Debug-Zertifikat bedeutet: Secrets griffen nicht → Update wäre wieder kaputt.
          if echo "$OUT" | grep -q "CN=Android Debug"; then
            echo "::error::APK ist mit Debug-Key signiert — Release abgebrochen."
            exit 1
          fi

      - name: APK umbenennen
        id: apk
        shell: bash
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          OUT="RotorApp-${{ steps.ver.outputs.tag }}.apk"
          test -f "$SRC"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "apk=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: RotorApp-${{ steps.ver.outputs.tag }}
          path: RotorApp-${{ steps.ver.outputs.tag }}.apk
          if-no-files-found: error

      - name: GitHub Release erstellen
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Rotor App ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: RotorApp-${{ steps.ver.outputs.tag }}.apk
          body: |
            ## Rotor App ${{ steps.ver.outputs.version }}

            Installierbare Release-APK (Sideload, fester DK8DE-Signaturschlüssel).

            Datei: `RotorApp-${{ steps.ver.outputs.tag }}.apk`

            Update über eine bereits installierte 1.2.2 oder älter ist nicht
            möglich — diese Releases hatten pro Build einen anderen Schlüssel.
            Einmalig alte App deinstallieren, danach lässt sich jede neue
            Version direkt drüber installieren.
